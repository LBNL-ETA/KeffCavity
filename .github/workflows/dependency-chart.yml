name: Dependency chart

on: [push, pull_request]

jobs:
  # Shows the dependency chart on the run's summary page. The CMake configure
  # writes doc/DependencyChart.md, which git ignores; nothing is committed.
  dependency-chart:
    name: Dependency chart
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Show the dependency chart on the run's summary page
        run: cat doc/DependencyChart.md >> "$GITHUB_STEP_SUMMARY"
