name: Dependency chart

on:
  push:
    branches: [rework/bcs]

jobs:
  dependency-chart:
    name: Dependency chart
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release

      - name: Show the dependency chart on the run's summary page
        run: cat doc/KeffCavity.md >> "$GITHUB_STEP_SUMMARY"

      - name: Copy the chart into doc and commit it when it changed
        if: github.ref == 'refs/heads/rework/bcs'
        run: |
          cp doc/KeffCavity.md doc/DependencyChart.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/DependencyChart.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh dependency chart [skip ci]"
          git pull --rebase origin rework/bcs
          git push origin HEAD:rework/bcs
